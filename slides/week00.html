## The twist
<p class="big">You'll leave owning an AI system that's <em>yours</em>.</p>

Not "we used ChatGPT in class."
You will **build, customize, and keep** your own AI *harness* — on your own laptop, in your own private GitHub — that keeps working for you long after this class ends.

<span class="note">This is the real edge over your peers.</span>

---

## Two strands, woven together
<span class="tag">EXPOSURE</span> — the ideas
Breadth: how computing works (the survey).

<span class="tag">PRACTICE</span> — the doing
Python basics · data science · **your AI harness**.

<small>You don't pick one. We do both, all semester.</small>

---

## What's an "AI harness"?
A personal command center for AI — a coding-agent that can read files, run tasks, search, and remember, all directed by you.

- **First half:** everyone builds a *barebones* one from scratch → you'll understand what it really is (no magic).
- **Second half:** you personalize it to fit *you*.
- **Final project:** use it with real data to build & present something.

---

- We use a **free Google Gemini API key** — **no credit card**, no cost.
- Runs on your own laptop.

## A 60-second taste
Everything — text, images, your TikTok swipes — becomes **numbers** (0s and 1s, *binary*).

```python
watched = 1;  liked = 0;  shared = 0;  skipped = 1
# → 1001
```

How that works — binary, Boolean logic, truth tables — is **next week**. Tonight we get you set up.
